// IEBridge autoconfig: registers chrome://iebridge/, applies default prefs and attaches the bridge to the real browser window.
(function () {
  var Cc = Components.classes, Ci = Components.interfaces, Cu = Components.utils;
  var dir = null;
  function log(msg) {
    try {
      var f = dir.clone();
      f.append("iebridge-log.txt");
      var s = Cc["@mozilla.org/network/file-output-stream;1"].createInstance(Ci.nsIFileOutputStream);
      s.init(f, 0x02 | 0x08 | 0x10, 438, 0); // write | create | append
      var line = msg + "\r\n";
      s.write(line, line.length);
      s.close();
    } catch (e) {}
  }
  try {
    var exe = Cc["@mozilla.org/file/directory_service;1"].getService(Ci.nsIProperties).get("XREExeF", Ci.nsIFile);
    dir = exe.parent;
    log("cfg loaded (multi-window), exe dir = " + dir.path);

    var m = dir.clone();
    m.append("iebridge");
    m.append("chrome.manifest");
    log("manifest exists = " + m.exists());
    Components.manager.QueryInterface(Ci.nsIComponentRegistrar).autoRegister(m);
    log("autoRegister ok");

    Cu.import("resource://gre/modules/Services.jsm");

    // Sets a default pref, skipping (and logging) any that doesn't match its type.
    // The built-in defaultPref() pops up a blocking alert on a mismatch, so it isn't used.
    var setDefault = function (name, value) {
      try {
        var br = Services.prefs.getDefaultBranch("");
        if (typeof value === "boolean") br.setBoolPref(name, value);
        else if (typeof value === "number") br.setIntPref(name, value);
        else br.setCharPref(name, value);
      } catch (e) {
        log("pref skipped: " + name + " (" + e + ")");
      }
    };

    var prefs = [
      // quiet startup, popups open in the same tab
      ["browser.shell.checkDefaultBrowser", false],
      ["browser.startup.homepage", "about:blank"],
      ["browser.startup.page", 0],
      ["startup.homepage_welcome_url", ""],
      ["startup.homepage_welcome_url.additional", ""],
      ["browser.startup.homepage_override.mstone", "ignore"],
      ["browser.sessionstore.resume_from_crash", false],
      ["browser.link.open_newwindow", 1],

      // performance pack for a 512MB machine on a slow disk
      ["browser.safebrowsing.malware.enabled", false],
      ["browser.safebrowsing.phishing.enabled", false],
      ["browser.safebrowsing.downloads.enabled", false],
      ["browser.safebrowsing.downloads.remote.enabled", false],
      ["browser.safebrowsing.blockedURIs.enabled", false],
      ["toolkit.telemetry.enabled", false],
      ["toolkit.telemetry.unified", false],
      ["datareporting.healthreport.uploadEnabled", false],
      ["datareporting.policy.dataSubmissionEnabled", false],
      ["app.update.enabled", false],
      ["extensions.update.enabled", false],
      ["extensions.blocklist.enabled", false],
      ["network.captive-portal-service.enabled", false],
      ["network.prefetch-next", false],
      ["network.dns.disablePrefetch", true],
      ["network.predictor.enabled", false],
      ["browser.sessionhistory.max_total_viewers", 0],
      ["dom.ipc.processCount", 1],
      ["dom.ipc.processPrelaunch.enabled", false],
      ["browser.tabs.remote.warmup.enabled", false],
      ["media.autoplay.default", 1]
    ];
    for (var i = 0; i < prefs.length; i++) setDefault(prefs[i][0], prefs[i][1]);
    log("default prefs applied: " + prefs.length);

    var observer = {
      observe: function (win, topic) {
        try {
          if (topic !== "browser-delayed-startup-finished") return;
          if (win.__iebridge) return;
          win.__iebridge = true;
          var m = {};
          Cu.import("chrome://iebridge/content/bridge.jsm", m);
          m.IEBridge.addView(win);
        } catch (e) {
          log("bridge start failed: " + e + " at " + e.fileName + ":" + e.lineNumber);
        }
      }
    };
    Services.obs.addObserver(observer, "browser-delayed-startup-finished", false);
    log("observer registered");
  } catch (e) {
    log("cfg failed: " + e);
  }
})();
